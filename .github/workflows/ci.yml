name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.17.3}
      - run: helm lint deploy/helm/inference --set-file config=config/production.example.yaml
      - run: helm template inference deploy/helm/inference --set-file config=config/production.example.yaml > /tmp/gateway.yaml
      - run: helm lint deploy/helm/vllm
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.11.4}
      - run: terraform fmt -check -recursive deploy/terraform
      - run: terraform -chdir=deploy/terraform/environments init -backend=false
      - run: terraform -chdir=deploy/terraform/environments validate
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.lock
      - run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 3
          done
          exit 1
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
