apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}, role: gateway}
  ports: [{port: 8000, targetPort: http, name: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}, role: gateway}
